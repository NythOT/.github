name: Jules AI Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Tarefa ou instrução para o Jules'
        required: true
        default: 'Analise o repositório e sugira melhorias ou correções.'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  jules:
    # Bots are skipped (no agent loops), except the NythOT Bot GitHub App, which opens the issues
    # reported on Discord (FEAT-BOT-005).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        (github.actor == 'nythot-bot[bot]' || (!endsWith(github.actor, '[bot]') && github.event.sender.type != 'Bot')) &&
        (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@jules')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@jules')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@jules')) ||
          (github.event_name == 'issues' && (contains(github.event.issue.body, '@jules') || contains(github.event.issue.title, '@jules')))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Extrair Prompt para o Jules
        id: resolve-prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROMPT: ${{ github.event.inputs.prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TASK_PROMPT="$DISPATCH_PROMPT"
          elif [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            TASK_PROMPT="$COMMENT_BODY"
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            TASK_PROMPT="$REVIEW_BODY"
          elif [ "$EVENT_NAME" = "issues" ]; then
            TASK_PROMPT="Issue: ${ISSUE_TITLE}"$'\n\n'"${ISSUE_BODY}"
          else
            TASK_PROMPT="Analise o repositório e aplique as tarefas necessárias."
          fi

          echo "prompt<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TASK_PROMPT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Iniciar Sessão do Google Jules
        id: jules_session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STARTING_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_PROMPT: ${{ steps.resolve-prompt.outputs.prompt }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          jq -n \
            --arg prompt "$TASK_PROMPT" \
            --arg branch "$STARTING_BRANCH" \
            --arg repo "$REPO_FULL_NAME" '{
              "prompt": $prompt,
              "sourceContext": {
                "source": "sources/github/\($repo)",
                "githubRepoContext": {
                  "startingBranch": $branch
                }
              },
              "requirePlanApproval": false,
              "automationMode": "AUTO_CREATE_PR"
            }' > jules_payload.json

          RESPONSE=$(curl -s 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d @jules_payload.json)

          echo "$RESPONSE"

          SESSION_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -n "$SESSION_URL" ]; then
            echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
            echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"

            echo "### 🤖 Google Jules Session Iniciada" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 **[Acessar Sessão no Console do Jules]($SESSION_URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Session ID:** \`$SESSION_ID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Branch:** \`$STARTING_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
            echo "* **Repositório:** \`$REPO_FULL_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Falha ao criar sessão do Jules: $RESPONSE"
            exit 1
          fi

      - name: Responder na Issue / PR com o link da sessão
        if: steps.jules_session.outputs.session_url != '' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_URL: ${{ steps.jules_session.outputs.session_url }}
          SESSION_ID: ${{ steps.jules_session.outputs.session_id }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          TARGET_NUM="${ISSUE_NUM:-$PR_NUM}"
          if [ -n "$TARGET_NUM" ]; then
            MSG="🤖 **Google Jules iniciado com sucesso!**"$'\n\n'"Acompanhe o planejamento, execução e criação do Pull Request em tempo real:"$'\n'"🔗 **[Ver Sessão no Console do Jules]($SESSION_URL)** *(ID: \`$SESSION_ID\`)*"
            gh issue comment "$TARGET_NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          fi
