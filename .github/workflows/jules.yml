name: Jules AI Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Tarefa ou instrução para o Jules'
        required: true
        default: 'Analise o repositório e sugira melhorias ou correções.'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  jules:
    # Who may start Jules: the NythOT Bot GitHub App (issues reported on Discord, FEAT-BOT-005), or a
    # person who is an owner, member or collaborator of the repository. Other bots are skipped (no
    # agent loops), and so is anyone else: in a public repository any GitHub account could otherwise
    # spend the organization's Jules quota with an @jules. Manual runs already need write access.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        (
          github.actor == 'nythot-bot[bot]' ||
          (
            !endsWith(github.actor, '[bot]') && github.event.sender.type != 'Bot' &&
            contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
          )
        ) &&
        (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@jules')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@jules')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@jules')) ||
          (github.event_name == 'issues' && (contains(github.event.issue.body, '@jules') || contains(github.event.issue.title, '@jules')))
        )
      )
    runs-on: ubuntu-latest
    # A review waits for the session (up to 45 min, below); this bounds the Actions minutes spent.
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Two modes (FEAT-INF-003):
      # - review: @jules asked inside a pull request. The session starts on the PR's branch, does
      #   not open a PR, and its final message is posted back on the PR when it ends.
      # - task: an issue, a comment on an issue, or a manual run. The session starts on the default
      #   branch and opens a PR by itself (AUTO_CREATE_PR); only its link is posted.
      - name: Contexto do pedido
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_PROMPT: ${{ github.event.inputs.prompt }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request.url }}
          PR_NUM_EVENT: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) REQUEST="$DISPATCH_PROMPT" ;;
            issue_comment|pull_request_review_comment) REQUEST="$COMMENT_BODY" ;;
            pull_request_review) REQUEST="$REVIEW_BODY" ;;
            issues) REQUEST="Issue: ${ISSUE_TITLE}"$'\n\n'"${ISSUE_BODY}" ;;
            *) REQUEST="Analise o repositório e aplique as tarefas necessárias." ;;
          esac

          PR_NUM=""
          if [ "$EVENT_NAME" = pull_request_review ] || [ "$EVENT_NAME" = pull_request_review_comment ]; then
            PR_NUM="$PR_NUM_EVENT"
          elif [ "$EVENT_NAME" = issue_comment ] && [ -n "$ISSUE_IS_PR" ]; then
            PR_NUM="$ISSUE_NUM"
          fi

          MODE=task
          BRANCH="$DEFAULT_BRANCH"
          PROMPT="$REQUEST"
          if [ -n "$PR_NUM" ]; then
            MODE=review
            PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUM")
            HEAD_REF=$(jq -r '.head.ref' <<<"$PR_JSON")
            HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<<"$PR_JSON")
            BASE_REF=$(jq -r '.base.ref' <<<"$PR_JSON")
            PR_TITLE=$(jq -r '.title' <<<"$PR_JSON")
            if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
              BRANCH="$HEAD_REF"
              WHERE="Você está no branch do PR (\`$HEAD_REF\`, que vai para \`$BASE_REF\`)."
            else
              WHERE="O branch do PR (\`$HEAD_REF\`) é de um fork, fora deste repositório: você está em \`$DEFAULT_BRANCH\`; peça o diff ao autor se precisar."
            fi
            PROMPT="Pedido feito no PR #$PR_NUM (\"$PR_TITLE\"). $WHERE"$'\n'"Não abra PR nem faça commit. Termine com uma mensagem final com o resultado (por exemplo, o review): ela será postada como comentário no PR."$'\n\n'"Pedido:"$'\n'"$REQUEST"
          fi

          {
            echo "mode=$MODE"
            echo "branch=$BRANCH"
            echo "target=${PR_NUM:-$ISSUE_NUM}"
            DELIM="PROMPT_$(openssl rand -hex 8)"
            echo "prompt<<$DELIM"
            echo "$PROMPT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Iniciar Sessão do Google Jules
        id: jules_session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MODE: ${{ steps.ctx.outputs.mode }}
          STARTING_BRANCH: ${{ steps.ctx.outputs.branch }}
          TASK_PROMPT: ${{ steps.ctx.outputs.prompt }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          jq -n \
            --arg prompt "$TASK_PROMPT" \
            --arg branch "$STARTING_BRANCH" \
            --arg repo "$REPO_FULL_NAME" \
            --arg mode "$MODE" '{
              "prompt": $prompt,
              "sourceContext": {
                "source": "sources/github/\($repo)",
                "githubRepoContext": {
                  "startingBranch": $branch
                }
              },
              "requirePlanApproval": false
            } + (if $mode == "task" then {"automationMode": "AUTO_CREATE_PR"} else {} end)' > jules_payload.json

          RESPONSE=$(curl -s 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -d @jules_payload.json)

          echo "$RESPONSE"

          SESSION_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          SESSION_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -n "$SESSION_URL" ]; then
            {
              echo "session_url=$SESSION_URL"
              echo "session_id=$SESSION_ID"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### 🤖 Google Jules Session Iniciada"
              echo "🔗 **[Acessar Sessão no Console do Jules]($SESSION_URL)**"
              echo "* **Session ID:** \`$SESSION_ID\`"
              echo "* **Modo:** \`$MODE\`"
              echo "* **Branch:** \`$STARTING_BRANCH\`"
              echo "* **Repositório:** \`$REPO_FULL_NAME\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Falha ao criar sessão do Jules: $RESPONSE"
            exit 1
          fi

      - name: Responder na Issue / PR com o link da sessão
        if: steps.jules_session.outputs.session_url != '' && steps.ctx.outputs.target != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_URL: ${{ steps.jules_session.outputs.session_url }}
          SESSION_ID: ${{ steps.jules_session.outputs.session_id }}
          MODE: ${{ steps.ctx.outputs.mode }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          TARGET_NUM: ${{ steps.ctx.outputs.target }}
        run: |
          if [ "$MODE" = review ]; then
            MSG="🤖 **Google Jules iniciado** no branch \`$BRANCH\`."$'\n\n'"O resultado será postado aqui quando a sessão terminar (espera de até 45 min)."$'\n'"🔗 **[Ver Sessão no Console do Jules]($SESSION_URL)** *(ID: \`$SESSION_ID\`)*"
          else
            MSG="🤖 **Google Jules iniciado com sucesso!**"$'\n\n'"Acompanhe o planejamento, execução e criação do Pull Request em tempo real:"$'\n'"🔗 **[Ver Sessão no Console do Jules]($SESSION_URL)** *(ID: \`$SESSION_ID\`)*"
          fi
          gh issue comment "$TARGET_NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"

      - name: Aguardar o Jules e postar o resultado no PR
        if: steps.jules_session.outputs.session_id != '' && steps.ctx.outputs.mode == 'review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          SESSION_URL: ${{ steps.jules_session.outputs.session_url }}
          SESSION_ID: ${{ steps.jules_session.outputs.session_id }}
          TARGET_NUM: ${{ steps.ctx.outputs.target }}
        run: |
          API="https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID"
          jules() { curl -s -H "X-Goog-Api-Key: $JULES_API_KEY" "$@"; }

          # Stops when the session ends or stops to wait for someone; otherwise after 45 min.
          DEADLINE=$((SECONDS + 45 * 60))
          STATE=""
          while :; do
            PREV="$STATE"
            STATE=$(jules "$API" | jq -r '.state // empty' 2>/dev/null || true)
            if [ "$STATE" != "$PREV" ]; then echo "$(date -u +%H:%M:%S) estado: ${STATE:-(sem resposta da API)}"; fi
            case "$STATE" in
              COMPLETED|FAILED|AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL|PAUSED) break ;;
            esac
            if [ "$SECONDS" -ge "$DEADLINE" ]; then STATE=TIMEOUT; break; fi
            sleep 30
          done
          echo "Estado final: $STATE"

          # All activities (paginated), oldest first.
          : > activities.json
          TOKEN=""
          while :; do
            PAGE=$(jules "$API/activities?pageSize=100${TOKEN:+&pageToken=$TOKEN}")
            jq -c '.activities[]?' <<<"$PAGE" >> activities.json 2>/dev/null || true
            TOKEN=$(jq -r '.nextPageToken // empty' <<<"$PAGE" 2>/dev/null || true)
            [ -z "$TOKEN" ] && break
          done
          LAST_MESSAGE=$(jq -rs '[.[] | select(.agentMessaged) | .agentMessaged.agentMessage] | last // ""' activities.json || true)
          FAIL_REASON=$(jq -rs '[.[] | select(.sessionFailed) | .sessionFailed.reason] | last // ""' activities.json || true)

          case "$STATE" in
            COMPLETED) HEAD="✅ **Jules terminou.**" ;;
            FAILED) HEAD="❌ **A sessão do Jules falhou.**${FAIL_REASON:+ Motivo: $FAIL_REASON}" ;;
            AWAITING_USER_FEEDBACK) HEAD="❓ **O Jules parou esperando uma resposta.** Responda na sessão." ;;
            AWAITING_PLAN_APPROVAL) HEAD="📋 **O Jules espera a aprovação do plano.** Aprove na sessão." ;;
            PAUSED) HEAD="⏸️ **A sessão do Jules foi pausada.**" ;;
            TIMEOUT) HEAD="⏱️ **O Jules não terminou em 45 min.** Acompanhe na sessão." ;;
            *) HEAD="⚠️ **Estado inesperado da sessão:** \`$STATE\`." ;;
          esac

          if [ -n "$LAST_MESSAGE" ]; then
            # GitHub comments hold 65536 characters.
            BODY="${LAST_MESSAGE:0:60000}"
            if [ "${#LAST_MESSAGE}" -gt 60000 ]; then BODY="$BODY"$'\n\n'"_(mensagem cortada; veja a íntegra na sessão)_"; fi
          else
            BODY="_O Jules não deixou mensagem final._"
          fi
          MSG="$HEAD"$'\n\n'"$BODY"$'\n\n'"---"$'\n'"🔗 [Sessão no Console do Jules]($SESSION_URL) *(ID: \`$SESSION_ID\`)*"
          gh issue comment "$TARGET_NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
